<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSTH CM - TX/RX System</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-border: rgba(255, 255, 255, 0.15);
      --active-color: #00d2ff;
      --active-glow: 0 0 20px rgba(0, 210, 255, 0.7);
      --text-color: #ffffff;
      --text-inactive: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      overflow: hidden; 
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2vh 2vw; 
    }

    .control-panel {
      background-color: var(--panel-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: fit-content; 
      min-width: 250px;
      padding: 3vh 20px; 
      height: 100%;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      gap: 15px; 
      position: relative;
    }

    /* 🔄 แถบเลือกโหมด TX / RX */
    .mode-selector {
      display: flex;
      width: 180px;       
      height: 32px;       
      min-height: 32px;   
      margin: 0 auto 5px auto; 
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--btn-border);
      flex-shrink: 0;     
    }
    .btn-mode {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-inactive);
      font-weight: bold;
      font-size: 13px;    
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-mode.active {
      background: var(--active-color);
      color: #0d1117;
    }

    /* 🔒 ดีไซน์กล่องใส่รหัส PIN */
    .pin-selector {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      width: 100%;
      max-width: 180px; 
      margin: 0 auto;
      flex-shrink: 0; 
    }
    .pin-input-group { display: flex; gap: 5px; }
    #roomPin {
      width: 50px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      padding: 4px;
      color: var(--active-color);
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      outline: none;
      letter-spacing: 1px;
    }
    #roomPin:focus { border-color: var(--active-color); }
    .btn-join {
      background: var(--active-color);
      color: #0d1117;
      border: none;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    /* ==================================
       📡 ส่วนของ TX PANEL
       ================================== */
    #txPanel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow: hidden;
    }

    /* 🟢 ไฟ LED สถานะตอบรับจาก RX (แก้ไขให้อยู่กึ่งกลาง) */
    .led-status {
      display: flex;
      align-items: center;
      justify-content: center; /* 💡 เพิ่มโค้ดบรรทัดนี้เพื่อจัดให้อยู่ตรงกลาง */
      gap: 6px;
      margin-bottom: -5px;
      width: 100%; /* 💡 บังคับให้กว้างเต็มกรอบเพื่อหาจุดกึ่งกลาง */
      flex-shrink: 0;
    }
    .led {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #333;
      box-shadow: inset 0 0 4px #000;
      transition: 0.3s;
    }
    .led.on {
      background: #00ff00;
      box-shadow: 0 0 10px #00ff00, inset 0 0 3px #fff;
    }
    .led-text { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: bold; letter-spacing: 1px; }

    .button-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly; 
      width: 100%;
      gap: 10px; 
    }

    .btn-remote {
      width: 140px;      
      max-width: 60vw;   
      height: 50px;     
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 12px;
      color: var(--text-inactive);
      font-size: 18px;   
      font-weight: 800;

      cursor: pointer;
      transition: all 0.3s ease;
